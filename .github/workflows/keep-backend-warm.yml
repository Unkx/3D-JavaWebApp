name: Keep backend warm

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: curl --fail --silent --show-error --max-time 30 "https://druk3d-backend.onrender.com/api/listings?page=0&size=1" > /dev/null
